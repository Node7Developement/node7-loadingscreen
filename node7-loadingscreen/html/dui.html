<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Node7 DUI</title>
    <link rel="stylesheet" href="dui.css">
</head>
<body>
    <main id="duiRoot" class="dui-root">
        <div class="dui-vignette" aria-hidden="true"></div>

        <section class="dui-brand">
            <span id="duiKicker" class="dui-kicker">A NODE7 PRODUCTION</span>
            <h1 id="duiTitle">NODE<span>7</span></h1>
            <div class="dui-rule"><i></i><b>◆</b><i></i></div>
            <p id="duiSubtitle">REDM ROLEPLAY FRAMEWORK</p>
            <span id="duiPlayer" class="dui-player"></span>
        </section>

        <aside class="dui-card">
            <div class="dui-card-glow" aria-hidden="true"></div>
            <header>
                <div>
                    <span id="duiPanelLabel" class="dui-label">COMMUNITY</span>
                    <span id="duiPanelEyebrow" class="dui-eyebrow">WELCOME TO NODE7</span>
                </div>
                <span id="duiPanelNumber" class="dui-number">01</span>
            </header>

            <h2 id="duiPanelTitle">BUILT AROUND THE COMMUNITY</h2>
            <p id="duiPanelIntro" class="dui-intro"></p>
            <div id="duiItems" class="dui-items"></div>

            <footer>
                <span id="duiProgress" class="dui-progress"></span>
                <span>NODE7 COMMUNITY</span>
            </footer>
        </aside>
    </main>

    <script src="config.js"></script>
    <script src="dui.js"></script>
</body>
</html>
